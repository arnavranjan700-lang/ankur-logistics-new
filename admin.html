<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankur Logistics | Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0f172a15;
    }
    h1 { color: #123b70; margin-top: 0; }
    p { color: #64748b; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #123b70;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ankur Logistics</h1>
    <p>Secure Admin Login</p>

    <form id="login-form">
      <label for="email">Admin email</label>
      <input id="email" type="email"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button type="submit">Login</button>
      <p id="message" role="status"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://skqtmrjfpaldtrpywlgv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_j4qMLbn40hK3wtswubwVDw_Ntk2oC51";

    const client = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    document.getElementById("login-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = document.getElementById("message");
        message.textContent = "Checking login...";

        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          message.textContent = "Login failed: " + error.message;
          return;
        }

        const { data: isAdmin, error: adminError } =
          await client.rpc("is_logistics_admin");

        if (adminError || isAdmin !== true) {
          await client.auth.signOut();
          message.textContent =
            "This account is not authorized as an administrator.";
          return;
        }

        message.textContent = "Login successful. Admin verified.";
      });
  </script>
</body>
</html>
