
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ankur Logistics | Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9; color: #172033;
    }
    main { max-width: 900px; margin: auto; }
    section {
      background: white; padding: 22px;
      margin: 18px 0; border-radius: 12px;
      box-shadow: 0 4px 18px #0000000c;
    }
    h1, h2 { color: #123b70; }
    label { display: block; margin-top: 13px; }
    input, select {
      width: 100%; padding: 11px; margin-top: 6px;
      border: 1px solid #cbd5e1; border-radius: 7px;
      font-size: 16px;
    }
    button {
      padding: 12px 16px; margin-top: 16px;
      border: 0; border-radius: 7px;
      background: #123b70; color: white;
      cursor: pointer; font-size: 15px;
    }
    .secondary { background: #475569; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    #dashboard { display: none; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hint { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Ankur Logistics</h1>
  <p>Shipment Administration</p>

  <section id="login">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required
             autocomplete="username">
      <label>Password</label>
      <input id="password" type="password" required
             autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </section>

  <div id="dashboard">
    <section>
      <h2>Add New Shipment</h2>
      <form id="addForm">
        <div class="grid">
          <div>
            <label>Tracking Number</label>
            <input id="tracking" required>
          </div>
          <div>
            <label>Shipment Type</label>
            <select id="type">
              <option>Parcel</option>
              <option>Document</option>
              <option>Goods</option>
            </select>
          </div>
          <div>
            <label>Sender City</label>
            <input id="sender" required>
          </div>
          <div>
            <label>Receiver City</label>
            <input id="receiver" required>
          </div>
          <div>
            <label>Weight (kg)</label>
            <input id="weight" type="number" min="0.01"
                   step="0.01" required>
          </div>
          <div>
            <label>Amount (₹)</label>
            <input id="amount" type="number" min="0"
                   step="0.01" required>
          </div>
          <div>
            <label>Initial Status</label>
            <select id="newStatus">
              <option>Booked</option>
              <option>Picked Up</option>
              <option>In Transit</option>
              <option>Out for Delivery</option>
              <option>Delivered</option>
              <option>Cancelled</option>
            </select>
          </div>
        </div>
        <button type="submit">Add Shipment</button>
      </form>
    </section>

    <section>
      <h2>Update Shipment Status</h2>
      <form id="updateForm">
        <label>Tracking Number</label>
        <input id="findTracking" required>
        <label>New Status</label>
        <select id="status">
          <option>Booked</option>
          <option>Picked Up</option>
          <option>In Transit</option>
          <option>Out for Delivery</option>
          <option>Delivered</option>
          <option>Cancelled</option>
        </select>
        <label>Current Location (optional)</label>
        <input id="location" placeholder="e.g. Jaipur">
        <label>Update Note (optional)</label>
        <input id="note" placeholder="e.g. Arrived at delivery hub">
        <button type="submit">Update Status</button>
      </form>
    </section>

    <section>
      <h2>Admin Session</h2>
      <button id="logout" class="secondary">Logout</button>
    </section>
  </div>

  <section>
    <p id="message" role="status"></p>
    <p class="hint">Admin access only. Never share your password or secret service-role key.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://skqtmrjfpaldtrpywlgv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j4qMLbn40hK3wtswubwVDw_Ntk2oC51";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let adminReady = false;

  function message(text) {
    $("message").textContent = text;
  }

  async function verifyAdmin() {
    const { data: { session }, error } = await db.auth.getSession();
    if (error || !session) {
      adminReady = false;
      $("login").style.display = "block";
      $("dashboard").style.display = "none";
      return false;
    }

    const { data, error: adminError } =
      await db.rpc("is_logistics_admin");

    if (adminError || data !== true) {
      await db.auth.signOut();
      adminReady = false;
      $("login").style.display = "block";
      $("dashboard").style.display = "none";
      message("Admin verification failed. Please log in again.");
      return false;
    }

    adminReady = true;
    $("login").style.display = "none";
    $("dashboard").style.display = "block";
    message("Admin verified. You can manage shipments.");
    return true;
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    message("Checking login...");

    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    if (error) {
      message("Login failed: " + error.message);
      return;
    }

    await verifyAdmin();
  });

  async function addEvent(shipmentId, status, location, note) {
    const { error } = await db.from("shipment_events").insert({
      shipment_id: shipmentId,
      status,
      location: location || null,
      note: note || null
    });
    if (error) throw error;
  }

  $("addForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!adminReady || !(await verifyAdmin())) return;

    message("Adding shipment...");

    const shipment = {
      tracking_number: $("tracking").value.trim(),
      sender_city: $("sender").value.trim(),
      receiver_city: $("receiver").value.trim(),
      shipment_type: $("type").value,
      weight_kg: Number($("weight").value),
      amount: Number($("amount").value),
      status: $("newStatus").value,
      updated_at: new Date().toISOString()
    };

    const { data, error } = await db
      .from("shipments")
      .insert(shipment)
      .select("id, tracking_number, status")
      .single();

    if (error) {
      message("Could not add shipment: " + error.message);
      return;
    }

    try {
      await addEvent(
        data.id, data.status, shipment.sender_city,
        "Shipment created"
      );
      message("Shipment added successfully!\nTracking number: " +
        data.tracking_number + "\nStatus: " + data.status);
      $("addForm").reset();
    } catch (err) {
      message("Shipment was created, but event history failed: " +
        err.message + "\nPlease check the shipment before retrying.");
    }
  });

  $("updateForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!adminReady || !(await verifyAdmin())) return;

    const tracking = $("findTracking").value.trim();
    const newStatus = $("status").value;
    const location = $("location").value.trim();
    const note = $("note").value.trim();

    message("Finding shipment...");

    const { data: shipment, error: findError } = await db
      .from("shipments")
      .select("id, tracking_number, status")
      .ilike("tracking_number", tracking)
      .maybeSingle();

    if (findError) {
      message("Search failed: " + findError.message);
      return;
    }
    if (!shipment) {
      message("No shipment found for tracking number: " + tracking);
      return;
    }

    const { error: updateError } = await db
      .from("shipments")
      .update({
        status: newStatus,
        updated_at: new Date().toISOString()
      })
      .eq("id", shipment.id);

    if (updateError) {
      message("Status update failed: " + updateError.message);
      return;
    }

    try {
      await addEvent(shipment.id, newStatus, location, note);
      message("Status updated successfully!\nTracking number: " +
        shipment.tracking_number + "\nNew status: " + newStatus);
      $("updateForm").reset();
    } catch (err) {
      message("Status updated, but event history failed: " +
        err.message + "\nPlease check the shipment history.");
    }
  });

  $("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    adminReady = false;
    $("dashboard").style.display = "none";
    $("login").style.display = "block";
    message("You have logged out.");
  });

  verifyAdmin();
</script>
</body>
</html>
